[pytest]

# 添加这一行，将当前目录（api/）加入 Python 路径
pythonpath = .

; 设置测试缓存文件存储在 tmp/.pytest_cache 中
cache_dir = tmp/.pytest_cache

; 设置默认的命令行选项
; -m 'not slow and not sandbox' 排除 slow（LLM eval）和 sandbox（Docker 对抗测试）
; 显式 `pytest -m slow` 或 `pytest -m sandbox` 可覆盖 addopts 的 marker 选择。
addopts = -v -s -m "not slow and not sandbox"

; 指定 Pytest 在哪些文件中查找测试函数
python_files = test_*.py *_test.py

; 指定 Pytest 在哪些类中查找测试方法
python_classes = Test*

; 指定 Pytest 在哪些函数中查找测试用例
python_functions = test_*

; 设置测试文件夹路径
testpaths = tests

; 注册自定义 marker，避免 PytestUnknownMarkWarning
markers =
    live_llm: requires real LLM API keys; skipped by default. Run with `pytest -m live_llm`.
    slow: long-running eval tests that hit real LLMs / embeddings (M1 PR-4+8 memory gate eval). Skipped by default.
    sandbox: adversarial tests that spawn ephemeral Docker containers (M3-B memory mount kernel invariants). Requires docker daemon; skipped if unavailable. Run with `pytest -m sandbox`.
    integration: requires a live Postgres (matches tests/integration/conftest.py). Some integration tests additionally need Redis — they are gated by their own fixtures and will fail at connect time if Redis is not reachable. R6 integration tests (migration / repository CRUD / concept-guard) are Postgres-only.
