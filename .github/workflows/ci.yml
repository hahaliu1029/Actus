name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/manus_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          JWT_SECRET_KEY: ci-test-secret-key
          ENV: test
        run: uv run pytest api/tests/ -v

  sandbox-adversarial:
    name: Sandbox Mount Adversarial Tests
    runs-on: ubuntu-latest
    # M3-B: kernel 级对抗测试（memory mount 拒写 + symlink 防御）。默认 pytest
    # 用 `-m "not slow and not sandbox"` 排除，这个 job 显式用 `-m sandbox`
    # 跑回来。ACTUS_REQUIRE_SANDBOX_TESTS=1 让 docker/alpine 缺失时硬 fail，
    # 防止 "CI 静默 skip = 安全回归不检" 的隐蔽退化（codex review P1）。

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Pre-pull alpine:3.20
        # CI runner 一般有 docker daemon，但镜像不预载；_docker_or_skip 禁止
        # 在线拉取（减少测试 flakiness），所以这里显式 pull 一次。
        run: docker pull alpine:3.20

      - name: Run sandbox adversarial tests
        working-directory: api
        env:
          ACTUS_REQUIRE_SANDBOX_TESTS: "1"
        run: uv run pytest tests/sandbox/ -m sandbox -v

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Run tests
        working-directory: ui
        run: npm run test

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t actus-api:ci ./api

      - name: Build Sandbox image
        run: docker build -t actus-sandbox:ci ./sandbox

      - name: Build UI image
        run: docker build -t actus-ui:ci ./ui --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
