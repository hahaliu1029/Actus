name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run lint gates (B5 PR-S1-7b)
        # AST scanners that block ``logging.basicConfig`` and bare
        # ``print()`` from re-entering the backend tree. Runs before
        # pytest so a fast lint failure short-circuits the slower
        # test job — and so a regression cannot ride into ``main``
        # even if no test happens to import the offending module.
        run: |
          uv run python api/tools/lint/no_logging_basicconfig.py
          uv run python api/tools/lint/no_print_in_backend.py

      - name: Run invariant gates (PE-0 Phase 11)
        # AST + behavior gates for PE/SSM separation contracts,
        # single-writer contract, and PE-dominance invariants.
        # Runs before the full test suite so a contract violation short-circuits early.
        env:
          SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/manus_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          JWT_SECRET_KEY: ci-test-secret-key
          ENV: test
        run: uv run pytest api/tests/invariants/ -v

      - name: Run tests
        env:
          SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/manus_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          JWT_SECRET_KEY: ci-test-secret-key
          ENV: test
        # C2 finish-core marker-split: backend-test runs everything EXCEPT
        # coordinator_recovery (AST gates + unit + non-recovery integration).
        # The dedicated `coordinator-e2e` job below runs the coordinator_recovery
        # set flag-ON against real pg+redis+minio+sandbox (test-only flag flip).
        run: |
          cd api
          uv run pytest -m "not coordinator_recovery and not slow and not sandbox and not browser_eval" --tb=short

  coordinator-e2e:
    name: Coordinator E2E (flag-on)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: manus_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
      # GitHub Actions `services:` can't pass MinIO's `server /data` command,
      # so run MinIO as a step + create the bucket the app writes.
      - name: Start MinIO + create bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/ready; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-08-13T08-35-41Z -c \
            "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb --ignore-existing --region us-east-1 local/a2a-mcp"
      - name: Build sandbox image
        # Coordinator E2E must exercise the sandbox code from this commit.
        # Pulling a mutable `latest` can silently bypass local sandbox fixes.
        run: docker build --build-arg PYTHON_PACKAGE_INDEX_URL=https://pypi.org/simple -t actus-sandbox:latest sandbox/
      - name: Run coordinator E2E (flag-on)
        env:
          SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/manus_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          JWT_SECRET_KEY: ci-test-secret-key
          ENV: test
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_SECURE: "false"            # default True -> HTTPS to HTTP MinIO fails
          MINIO_BUCKET_NAME: a2a-mcp        # matches settings default; bucket created above
          SANDBOX_IMAGE: actus-sandbox:latest  # default None -> DockerSandbox.create fails
          ACTUS_C2_COORDINATOR_ENABLED: "true"
          # [S2 PR-6] shell-mode master flag ON for the live shell-mode E2E
          # (test_coordinator_e2e_shell_mode.py). Default OFF elsewhere; this
          # job is the only flag-ON-shell-mode run.
          ACTUS_C2_COORDINATOR_SHELL_MODE_ENABLED: "true"
        # NOTE: no --strict-markers here. Collection imports the WHOLE test tree
        # before -m deselection, and pre-existing unrelated files use unregistered
        # markers (`asyncio`, `network`); --strict-markers would promote those to
        # collection ERRORS and fail the job. The coordinator markers ARE
        # registered in api/pytest.ini and the `-m "coordinator_recovery ..."`
        # selection self-validates (0 selected if it were typo'd). Matches the
        # backend-test job, which also runs without --strict-markers.
        run: |
          cd api
          uv run pytest -m "coordinator_recovery and not slow and not browser_eval" --tb=short -rs

  sandbox-adversarial:
    name: Sandbox Mount Adversarial Tests
    runs-on: ubuntu-latest
    # M3-B: kernel 级对抗测试（memory mount 拒写 + symlink 防御）。默认 pytest
    # 用 `-m "not slow and not sandbox"` 排除，这个 job 显式用 `-m sandbox`
    # 跑回来。ACTUS_REQUIRE_SANDBOX_TESTS=1 让 docker/alpine 缺失时硬 fail，
    # 防止 "CI 静默 skip = 安全回归不检" 的隐蔽退化（codex review P1）。

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Pre-pull probe images
        # CI runner 一般有 docker daemon，但镜像不预载；_docker_or_skip 禁止
        # 在线拉取（减少测试 flakiness），所以这里显式 pull。Retry each pull
        # (transient Docker Hub blips); FAIL if an image never pulls (plan-R2 P3).
        run: |
          for img in alpine:3.20 python:3.12-alpine; do
            for i in 1 2 3; do docker pull "$img" && break; [ "$i" = 3 ] && exit 1; sleep 5; done
          done

      - name: Run sandbox adversarial + cap-enforcement tests
        working-directory: api
        env:
          ACTUS_REQUIRE_SANDBOX_TESTS: "1"
          JWT_SECRET_KEY: ci-test-secret-key
          ENV: test
        run: uv run pytest tests/sandbox/ -m "sandbox and not sandbox_real_image" -v

  sandbox-hardening-smoke:
    name: Sandbox Hardening Smoke (real image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # C5d-1 surface ②③: boot the REAL actus-sandbox image with the C5c hardening
    # profile ON and prove the workload survives + the container has the caps
    # dropped. Standalone — the sandbox app needs no pg/redis/minio.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Build sandbox image
        # Retry the build (transient apt/NodeSource/PPA pulls); FAIL the step if all
        # attempts fail — a bare `|| sleep` loop would exit 0 on the final sleep
        # (plan-R2 P3 silent-failure fix).
        run: |
          for i in 1 2 3; do
            docker build --build-arg PYTHON_PACKAGE_INDEX_URL=https://pypi.org/simple -t actus-sandbox:latest sandbox/ && exit 0
            echo "build attempt $i failed"; sleep 10
          done
          exit 1

      - name: Run hardening smoke (flag-on, real image)
        working-directory: api
        env:
          ACTUS_REQUIRE_SANDBOX_TESTS: "1"
          JWT_SECRET_KEY: ci-test-secret-key
          ENV: test
          SANDBOX_IMAGE: actus-sandbox:latest
          SANDBOX_NAME_PREFIX: actus-sb
          MEMORY_ROOT_HOST: "${{ runner.temp }}/actus-hardening-memory"
          MEMORY_ROOT_CONTAINER: "${{ runner.temp }}/actus-hardening-memory"
        run: uv run pytest tests/sandbox/ -m "sandbox and sandbox_real_image" -v

  sandbox-test:
    name: Sandbox Unit Tests (S1 atomic write)
    runs-on: ubuntu-latest
    # S1: sandbox FileService atomic-write + idempotent-delete unit tests.
    # The sandbox is a uv workspace member but ships its OWN `app` package
    # that collides with `api/app`, so it runs as its own pytest project from
    # the member dir against the shared workspace venv. `--locked` fails the
    # job if the committed root uv.lock is stale (forgotten `uv lock` after
    # adding the pytest dev-deps). Pure os/tempfile behavior — no Docker, no
    # DB, no Redis.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run sandbox unit tests
        working-directory: sandbox
        run: uv run --locked pytest -q

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Run tests
        working-directory: ui
        run: npm run test

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate standard Compose MinIO config
        shell: bash
        run: |
          set -euo pipefail
          MINIO_API_PORT=19000 docker compose --env-file .env.example config -q
          rendered="$(MINIO_API_PORT=19000 docker compose --env-file .env.example config)"
          api_block="$(sed -n '/^  api:/,/^  minio:/p' <<<"$rendered")"
          minio_block="$(sed -n '/^  minio:/,/^  minio-init:/p' <<<"$rendered")"
          grep -Fq 'MINIO_PUBLIC_ENDPOINT: localhost:19000' <<<"$api_block"
          grep -Fq 'host_ip: 127.0.0.1' <<<"$minio_block"
          grep -Fq 'published: "19000"' <<<"$minio_block"

      - name: Build API image
        run: docker build --build-arg PYTHON_PACKAGE_INDEX_URL=https://pypi.org/simple -t actus-api:ci ./api

      - name: Build Sandbox image
        run: docker build --build-arg PYTHON_PACKAGE_INDEX_URL=https://pypi.org/simple -t actus-sandbox:ci ./sandbox

      - name: Build UI image
        run: docker build -t actus-ui:ci ./ui --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
