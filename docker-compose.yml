services:
  sandbox-image:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
      args:
        PYTHON_PACKAGE_INDEX_URL: ${PYTHON_PACKAGE_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        INSTALL_WHISPER: ${INSTALL_WHISPER:-false}
    image: ${SANDBOX_IMAGE:-actus-sandbox:latest}
    command: ["/bin/sh", "-c", "echo 'sandbox image is ready'"]
    restart: "no"
    networks:
      - actus-net

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env}  # ⚠️ 必须在 .env 中设置
      POSTGRES_DB: ${POSTGRES_DB:-manus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-manus}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - actus-net

  redis:
    image: redis:8.2
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - actus-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        PYTHON_PACKAGE_INDEX_URL: ${PYTHON_PACKAGE_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: actus-api:latest
    restart: unless-stopped
    # ⚠️ Sandbox lifecycle 要求单 worker 部署（spec §8.6 / §12 Q5）
    # 多 worker 需先完成跨进程协调 spec，不得直接 scale
    deploy:
      replicas: 1
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CONTAINER_TIMEZONE: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
      WEB_CONCURRENCY: "1"  # Sandbox lifecycle 要求单 worker，见 CONTRIBUTING.md
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_CONFIG_FILEPATH: /app/data/config.yaml
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-manus}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_REGION: ${MINIO_REGION:-}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-a2a-mcp}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required - set it in .env}  # ⚠️ 必须在 .env 中设置
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-actus-sandbox:latest}
      SANDBOX_NAME_PREFIX: ${SANDBOX_NAME_PREFIX:-actus-sb}
      SANDBOX_TTL_MINUTES: ${SANDBOX_TTL_MINUTES:-60}
      SANDBOX_NETWORK: ${DOCKER_NETWORK_NAME:-actus-net}
      SANDBOX_CHROME_ARGS: ${SANDBOX_CHROME_ARGS:-}
      SANDBOX_HTTP_PROXY: ${SANDBOX_HTTP_PROXY:-}
      SANDBOX_HTTPS_PROXY: ${SANDBOX_HTTPS_PROXY:-}
      SANDBOX_NO_PROXY: ${SANDBOX_NO_PROXY:-}
      # Memory 系统 (M1 PR-6A)：host 侧根 + api 容器视角根 + sandbox mount 开关。
      # api 通过下方 volume 把 host 路径绑到容器内；sandbox 在起容器时通过
      # Docker SDK 再把同一 host 路径只读挂到 /workspace/.memory（DockerSandbox._build_memory_mount）。
      MEMORY_ROOT_HOST: ${MEMORY_ROOT_HOST:?MEMORY_ROOT_HOST is required and must be an absolute host path}
      MEMORY_ROOT_CONTAINER: ${MEMORY_ROOT_CONTAINER:-/app/data/memory}
      SANDBOX_MEMORY_MOUNT_TARGET: ${SANDBOX_MEMORY_MOUNT_TARGET:-/workspace/.memory}
      SANDBOX_MEMORY_MOUNT_ENABLED: ${SANDBOX_MEMORY_MOUNT_ENABLED:-true}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-actus}
      # C2 CoordinatorTaskRunner v1 feature flag (spec §6.4). Default off until
      # PR-9 acceptance; flip per CONTRIBUTING.md "C2 CoordinatorTaskRunner
      # Deployment" rollout checklist.
      ACTUS_C2_COORDINATOR_ENABLED: ${ACTUS_C2_COORDINATOR_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-}
      WECHAT_FRONTEND_REDIRECT_URI: ${WECHAT_FRONTEND_REDIRECT_URI:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api-data:/app/data
      - ./api/config.yaml:/app/data/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      # Memory bind (M1 PR-6A)：host 侧的 memory 根目录同时可见给 api（读写，
      # FsMemoryWriter 在此落盘）和 sandbox（只读，由 DockerSandbox 程序化注入）。
      # 首次启动前部署者必须：
      #   mkdir -p ${MEMORY_ROOT_HOST}
      #   # 如果把 ACTUS_UID 设成非 root，额外：
      #   # sudo chown -R ${ACTUS_UID}:${ACTUS_GID} ${MEMORY_ROOT_HOST}
      - ${MEMORY_ROOT_HOST:?MEMORY_ROOT_HOST is required and must be an absolute host path}:${MEMORY_ROOT_CONTAINER:-/app/data/memory}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - actus-net

  ui-app:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
    image: actus-ui-app:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - actus-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.nginx
    image: actus-ui:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      ui-app:
        condition: service_healthy
    ports:
      - "${UI_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - actus-net

  # ---------- SSH 反向隧道（将 API 暴露到云服务器） ----------
  tunnel:
    image: alpine:3.20
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      TUNNEL_REMOTE_HOST: ${TUNNEL_REMOTE_HOST:-}
      TUNNEL_REMOTE_PORT: ${TUNNEL_REMOTE_PORT:-18082}
      TUNNEL_SSH_USER: ${TUNNEL_SSH_USER:-root}
      TUNNEL_SSH_PORT: ${TUNNEL_SSH_PORT:-22}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache openssh-client autossh &&
        mkdir -p /root/.ssh &&
        cp /ssh-key/id_rsa /root/.ssh/id_rsa &&
        chmod 600 /root/.ssh/id_rsa &&
        ssh-keyscan -p $${TUNNEL_SSH_PORT} $${TUNNEL_REMOTE_HOST} > /root/.ssh/known_hosts 2>/dev/null &&
        echo "Starting tunnel: cloud:$${TUNNEL_REMOTE_PORT} -> api:8000" &&
        exec autossh -M 0 -N \
          -o "ServerAliveInterval=15" \
          -o "ServerAliveCountMax=3" \
          -o "ExitOnForwardFailure=yes" \
          -o "StrictHostKeyChecking=accept-new" \
          -p $${TUNNEL_SSH_PORT} \
          -R 0.0.0.0:$${TUNNEL_REMOTE_PORT}:api:8000 \
          $${TUNNEL_SSH_USER}@$${TUNNEL_REMOTE_HOST}
    volumes:
      - ${TUNNEL_SSH_KEY_PATH:-./tunnel/id_rsa}:/ssh-key/id_rsa:ro
    networks:
      - actus-net

volumes:
  postgres-data:
  redis-data:
  api-data:

networks:
  actus-net:
    name: ${DOCKER_NETWORK_NAME:-actus-net}
