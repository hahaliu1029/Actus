services:
  sandbox-image:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
      args:
        PYTHON_PACKAGE_INDEX_URL: ${PYTHON_PACKAGE_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        INSTALL_WHISPER: ${INSTALL_WHISPER:-false}
    image: ${SANDBOX_IMAGE:-actus-sandbox:latest}
    command: ["/bin/sh", "-c", "echo 'sandbox image is ready'"]
    restart: "no"
    networks:
      - actus-net

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - set it in .env}  # ⚠️ 必须在 .env 中设置
      POSTGRES_DB: ${POSTGRES_DB:-manus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-manus}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - actus-net

  redis:
    image: redis:8.2
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - actus-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SITE_REGION: ${MINIO_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - actus-net

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-a2a-mcp}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local http://minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        mc mb --ignore-existing --region "$${MINIO_REGION}" "local/$${MINIO_BUCKET_NAME}"
    networks:
      - actus-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        PYTHON_PACKAGE_INDEX_URL: ${PYTHON_PACKAGE_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
    image: actus-api:latest
    restart: unless-stopped
    # ⚠️ Sandbox lifecycle 要求单 worker 部署（spec §8.6 / §12 Q5）
    # 多 worker 需先完成跨进程协调 spec，不得直接 scale
    deploy:
      replicas: 1
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      CONTAINER_TIMEZONE: ${TZ:-Asia/Shanghai}
      PYTHONUNBUFFERED: "1"
      WEB_CONCURRENCY: "1"  # Sandbox lifecycle 要求单 worker，见 CONTRIBUTING.md
      ENV: ${ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_CONFIG_FILEPATH: /app/data/config.yaml
      SQLALCHEMY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-manus}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:-localhost:${MINIO_API_PORT:-9000}}"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-a2a-mcp}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required - set it in .env}  # ⚠️ 必须在 .env 中设置
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-actus-sandbox:latest}
      SANDBOX_NAME_PREFIX: ${SANDBOX_NAME_PREFIX:-actus-sb}
      SANDBOX_TTL_MINUTES: ${SANDBOX_TTL_MINUTES:-60}
      SANDBOX_NETWORK: ${DOCKER_NETWORK_NAME:-actus-net}
      SANDBOX_CHROME_ARGS: ${SANDBOX_CHROME_ARGS:-}
      SANDBOX_HTTP_PROXY: ${SANDBOX_HTTP_PROXY:-}
      SANDBOX_HTTPS_PROXY: ${SANDBOX_HTTPS_PROXY:-}
      SANDBOX_NO_PROXY: ${SANDBOX_NO_PROXY:-}
      # SPM §5.1 三档沙箱供给模式（env-only）。always=每 session 预置父沙箱（现状）；
      # on_demand / off 分别在 PR-2 / PR-4 解锁。缺 passthrough 则 Docker 部署永远无法切换。
      SANDBOX_PROVISION_MODE: ${SANDBOX_PROVISION_MODE:-always}
      # SPM §5.2 on_demand 供给单飞超时（秒）；create/ready/hooks 三相总预算。缺 passthrough
      # 则 Docker 部署无法调整超时（config 默认 90）。
      SANDBOX_PROVISION_TIMEOUT_SECONDS: ${SANDBOX_PROVISION_TIMEOUT_SECONDS:-90}
      # Memory 系统 (M1 PR-6A)：host 侧根 + api 容器视角根 + sandbox mount 开关。
      # api 通过下方 volume 把 host 路径绑到容器内；sandbox 在起容器时通过
      # Docker SDK 再把同一 host 路径只读挂到 /workspace/.memory（DockerSandbox._build_memory_mount）。
      MEMORY_ROOT_HOST: ${MEMORY_ROOT_HOST:?MEMORY_ROOT_HOST is required and must be an absolute host path}
      MEMORY_ROOT_CONTAINER: ${MEMORY_ROOT_CONTAINER:-/app/data/memory}
      SANDBOX_MEMORY_MOUNT_TARGET: ${SANDBOX_MEMORY_MOUNT_TARGET:-/workspace/.memory}
      SANDBOX_MEMORY_MOUNT_ENABLED: ${SANDBOX_MEMORY_MOUNT_ENABLED:-true}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-actus}
      # C2 CoordinatorTaskRunner v1 feature flag (spec §6.4). Compose default off
      # (set via .env); flip per CONTRIBUTING.md "C2 CoordinatorTaskRunner
      # Deployment" rollout checklist.
      ACTUS_C2_COORDINATOR_ENABLED: ${ACTUS_C2_COORDINATOR_ENABLED:-false}
      # C2-full S2 shell-capable task mode (spec §3.6). Default off; read from
      # os.environ directly, so without this passthrough a Docker deployment can
      # never enable it (previously the only C2 flag missing from compose).
      ACTUS_C2_COORDINATOR_SHELL_MODE_ENABLED: ${ACTUS_C2_COORDINATOR_SHELL_MODE_ENABLED:-false}
      # C2-full S4 agent-team named bundles (spec §6/R6-F6). Default off; the flag
      # is read from os.environ directly, so without this passthrough a Docker
      # deployment can never enable it.
      ACTUS_C2_AGENT_TEAMS_ENABLED: ${ACTUS_C2_AGENT_TEAMS_ENABLED:-false}
      # D1a extension governance mode (spec §2). env-only three-state switch;
      # default off. Without this passthrough a Docker deployment can never
      # enable governance (compose env block is an explicit whitelist).
      EXTENSION_GOVERNANCE_MODE: ${EXTENSION_GOVERNANCE_MODE:-off}
      # Metrics endpoint auth token (B5 observability). Empty (default) →
      # /api/v1/metrics 404s (endpoint disabled). Required for the C2 coordinator
      # live-acceptance + perf-sampling runbooks (scrape sends Authorization:
      # Bearer <token>). Without this passthrough the container's token is always
      # empty, so the scrape 404s regardless of .env. App accepts this
      # ACTUS_-prefixed name OR unprefixed METRICS_ENDPOINT_TOKEN
      # (core/config.py AliasChoices).
      ACTUS_METRICS_ENDPOINT_TOKEN: ${ACTUS_METRICS_ENDPOINT_TOKEN:-}
      # C2 coordinator hard caps（pass-through；两个 wallclock deadline 在 compose
      # 层也明确默认 0=无限制，其余未设置时由 loader 走代码默认）。
      ACTUS_COORDINATOR_MAX_WORK_UNITS_PER_RUN: ${ACTUS_COORDINATOR_MAX_WORK_UNITS_PER_RUN:-}
      ACTUS_COORDINATOR_MAX_TOOL_CALLS_PER_CHILD: ${ACTUS_COORDINATOR_MAX_TOOL_CALLS_PER_CHILD:-}
      ACTUS_COORDINATOR_MAX_TOKEN_COST_USD_PER_CHILD: ${ACTUS_COORDINATOR_MAX_TOKEN_COST_USD_PER_CHILD:-}
      ACTUS_COORDINATOR_MAX_WALLCLOCK_SECONDS_PER_CHILD: ${ACTUS_COORDINATOR_MAX_WALLCLOCK_SECONDS_PER_CHILD:-0}
      ACTUS_COORDINATOR_MAX_TOTAL_TOKEN_COST_USD_PER_RUN: ${ACTUS_COORDINATOR_MAX_TOTAL_TOKEN_COST_USD_PER_RUN:-}
      ACTUS_COORDINATOR_MAX_TOTAL_WALLCLOCK_SECONDS_PER_RUN: ${ACTUS_COORDINATOR_MAX_TOTAL_WALLCLOCK_SECONDS_PER_RUN:-0}
      ACTUS_COORDINATOR_MAX_CONCURRENT_RUNS_PER_USER: ${ACTUS_COORDINATOR_MAX_CONCURRENT_RUNS_PER_USER:-}
      ACTUS_COORDINATOR_MAX_TOKEN_COST_USD_PER_USER_PER_DAY: ${ACTUS_COORDINATOR_MAX_TOKEN_COST_USD_PER_USER_PER_DAY:-}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-}
      WECHAT_FRONTEND_REDIRECT_URI: ${WECHAT_FRONTEND_REDIRECT_URI:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - api-data:/app/data
      - ./api/config.yaml:/app/data/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      # Memory bind (M1 PR-6A)：host 侧的 memory 根目录同时可见给 api（读写，
      # FsMemoryWriter 在此落盘）和 sandbox（只读，由 DockerSandbox 程序化注入）。
      # 首次启动前部署者必须：
      #   mkdir -p ${MEMORY_ROOT_HOST}
      #   # 如果把 ACTUS_UID 设成非 root，额外：
      #   # sudo chown -R ${ACTUS_UID}:${ACTUS_GID} ${MEMORY_ROOT_HOST}
      - ${MEMORY_ROOT_HOST:?MEMORY_ROOT_HOST is required and must be an absolute host path}:${MEMORY_ROOT_CONTAINER:-/app/data/memory}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/docs > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - actus-net

  ui-app:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
    image: actus-ui-app:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - actus-net

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.nginx
    image: actus-ui:latest
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      ui-app:
        condition: service_healthy
    ports:
      - "${UI_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - actus-net

  # ---------- SSH 反向隧道（将 API 暴露到云服务器） ----------
  tunnel:
    image: alpine:3.20
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      api:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      TUNNEL_REMOTE_HOST: ${TUNNEL_REMOTE_HOST:-}
      TUNNEL_REMOTE_PORT: ${TUNNEL_REMOTE_PORT:-18082}
      TUNNEL_SSH_USER: ${TUNNEL_SSH_USER:-root}
      TUNNEL_SSH_PORT: ${TUNNEL_SSH_PORT:-22}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache openssh-client autossh &&
        mkdir -p /root/.ssh &&
        cp /ssh-key/id_rsa /root/.ssh/id_rsa &&
        chmod 600 /root/.ssh/id_rsa &&
        ssh-keyscan -p $${TUNNEL_SSH_PORT} $${TUNNEL_REMOTE_HOST} > /root/.ssh/known_hosts 2>/dev/null &&
        echo "Starting tunnel: cloud:$${TUNNEL_REMOTE_PORT} -> api:8000" &&
        exec autossh -M 0 -N \
          -o "ServerAliveInterval=15" \
          -o "ServerAliveCountMax=3" \
          -o "ExitOnForwardFailure=yes" \
          -o "StrictHostKeyChecking=accept-new" \
          -p $${TUNNEL_SSH_PORT} \
          -R 0.0.0.0:$${TUNNEL_REMOTE_PORT}:api:8000 \
          $${TUNNEL_SSH_USER}@$${TUNNEL_REMOTE_HOST}
    volumes:
      - ${TUNNEL_SSH_KEY_PATH:-./tunnel/id_rsa}:/ssh-key/id_rsa:ro
    networks:
      - actus-net

volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-data:

networks:
  actus-net:
    name: ${DOCKER_NETWORK_NAME:-actus-net}
